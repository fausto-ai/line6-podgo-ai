<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LINE 6 POD GO AI - Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = { 
      darkMode: 'class', 
      theme: { 
        extend: { 
          colors: { 
            brand: { bg: '#07090e', accent: '#ff2a2a', accentHover: '#dc2626', orange: '#ff6b00', text: '#f1f5f9', muted: '#64748b' } 
          } 
        } 
      } 
    };
  </script>
  <style>
    body {
      background-color: #07090e;
      background-image:
        radial-gradient(circle at 15% 25%, rgba(255, 42, 42, 0.14) 0%, transparent 42%),
        radial-gradient(circle at 85% 65%, rgba(255, 107, 0, 0.10) 0%, transparent 42%),
        linear-gradient(to bottom, #07090e, #05070b);
      color: #f1f5f9;
    }
    .glass-panel {
      background: rgba(14, 18, 28, 0.72);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.75);
    }
    .neon-border-btn {
      background: rgba(0, 0, 0, 0.55);
      border: 1px solid rgba(255, 42, 42, 0.45);
      transition: all 0.25s ease;
      cursor: pointer;
    }
    .neon-border-btn:hover {
      border-color: rgba(255, 42, 42, 0.9);
      box-shadow: 0 0 18px rgba(255, 42, 42, 0.25);
    }
  </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4 relative overflow-hidden">
  
  <div class="glass-panel w-full max-w-sm rounded-3xl p-8 z-10 flex flex-col relative">
    
    <!-- Cabecera Line 6 POD Go -->
    <div class="flex items-center gap-4 mb-2">
      <div class="w-12 h-12 rounded-xl bg-brand-accent/10 border border-brand-accent/40 flex items-center justify-center text-brand-accent shadow-[0_0_15px_rgba(255,42,42,0.25)]">
        <i class="fa-solid fa-sliders text-xl"></i>
      </div>
      <div>
        <h2 class="text-xl font-black tracking-wider leading-tight text-white">LINE 6 <span class="text-brand-accent">POD GO</span></h2>
        <h3 class="text-xs font-mono text-brand-muted tracking-widest">AI TONE STUDIO v2.50</h3>
      </div>
    </div>
    <p class="text-xs text-brand-muted mb-8 tracking-wide">Smart Cloud Access to Authentic HX & POD Go Tones</p>

    <!-- Botón Google -->
    <div class="space-y-4 mb-4">
      <button id="btn-google" class="neon-border-btn w-full py-3.5 px-4 rounded-xl flex items-center justify-center gap-3 text-sm font-semibold tracking-wide text-white">
        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
          <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
          <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
          <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
          <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
        </svg>
        Sign in with Google
      </button>
    </div>

    <p class="text-[10px] text-center text-brand-muted font-mono">
      Powered by Line 6 POD Go Firmware v2.50 Engine
    </p>
  </div>

  <!-- SCRIPT DE FIREBASE Y LÓGICA DE LOGIN -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDMZxIgDvBRJNyIZuo3CDwnyvx1INm7LsM",
      authDomain: "mooer-ai-tone-studio.firebaseapp.com",
      projectId: "mooer-ai-tone-studio",
      storageBucket: "mooer-ai-tone-studio.firebasestorage.app",
      messagingSenderId: "666841738973",
      appId: "1:666841738973:web:2c0937a5b2a51b143c3534"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();

    const btnGoogle = document.getElementById('btn-google');
    btnGoogle.addEventListener('click', async () => {
      try {
        await signInWithPopup(auth, provider);
        window.location.href = "index.html";
      } catch (error) {
        console.error("Error al iniciar sesión:", error);
        alert("Authentication failed: " + error.message);
      }
    });
  </script>
</body>
</html>
